<!doctype html>
<html>

<body>
<x-dc>

        <div style="display:flex; flex-direction:row; align-items:baseline; gap:4px;">
          <span class="ar" style="font-size:12px; color:#8a929e;">عدد القطع</span>
          <span class="en" style="font-size:9px; color:#c3c8cf;">Items</span>
        </div>
        <span class="en" style="font-size:12px; color:#374151; font-weight:600;">4 items</span>

      <div style="display:flex; flex-direction:row; align-items:baseline; justify-content:space-between; margin-bottom:14px;">

<script data-dc-script data-props='{"accent":{"editor":"color","default":"#1A56DB","section":"Theme"}}'>

  renderVals() {
    return {
      accent: this.props.accent ?? '#1A56DB'
    };
  }
}
</script>
